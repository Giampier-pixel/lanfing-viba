<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Favicon VIBA TECH — versión "App Icon" del Manual de Identidad (§9):
    isotipo en Verde Lima centrado sobre contenedor en Negro Profundo.
    El contenedor no es decorativo: garantiza el contraste tanto en pestañas
    claras como oscuras y evita la versión de bajo contraste que el manual
    prohíbe (lima sobre fondo claro).
    El grosor de las ondas se sube de 5 a 6.5 respecto al isotipo original,
    para que no se empasten a 16-32 px (§5, tamaños mínimos).
  -->
  <rect width="100" height="100" rx="20" fill="#050505"/>
  <g transform="translate(14.8 12) scale(0.704)" fill="none">
    <!-- Ondas superiores: conectividad -->
    <g stroke="#b5f400" stroke-width="6.5" stroke-linecap="round">
      <path d="M14.4 22.1a43 43 0 0 1 72.2 0"/>
      <path d="M28.9 31.5a25.75 25.75 0 0 1 43.2 0"/>
    </g>
    <!-- Nodo central: el colaborador -->
    <circle cx="50.5" cy="45.5" r="13" fill="#b5f400"/>
    <!-- "V" inferior: estructura y base operativa -->
    <path d="M0 31 0 61 44.6 101.6Q50.5 107 56.4 101.6L100 61 100 31 97.8 31 53.8 76.4Q50.3 80 46.8 76.4L2 31Z" fill="#b5f400"/>
  </g>
</svg>
